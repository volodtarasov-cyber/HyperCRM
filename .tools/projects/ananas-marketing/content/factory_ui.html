<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Контент-завод · Ананас Маркетинг</title>
<style>
:root{--ink:#292137;--muted:#777283;--paper:#f5f4f7;--line:#e5e2e9;--yellow:#ffba24;--green:#276e4a;--red:#ad3f36;font-family:Manrope,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--ink);font-weight:600}button:hover{border-color:#b2a8c2}button:disabled{opacity:.4;cursor:default}.primary{background:var(--yellow);border-color:var(--yellow)}.dark{background:var(--ink);color:white;border-color:var(--ink)}.small{padding:7px 10px;font-size:12px}a{color:#644b8e;text-decoration:none}a:hover{text-decoration:underline}.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.sidebar{padding:30px 20px;background:var(--ink);color:white;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{font-size:13px;letter-spacing:1.5px;line-height:1.8;font-weight:750}.brand strong{color:var(--yellow);display:block;font-size:23px;letter-spacing:2px}.brand span{color:#bfb6cd;font-size:11px;letter-spacing:0}.side-caption{text-transform:uppercase;font-size:10px;letter-spacing:2px;color:#ab9fba;margin:40px 12px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;background:transparent;border:0;color:#c8c0d4;font-weight:500;padding:12px}.nav button.active{color:white;background:#43364f}.nav button b{display:inline-block;width:24px;color:#c6b1e4}.sidebar footer{margin-top:auto;color:#b9afc6;font-size:12px;line-height:1.8;padding:22px 12px 0}.sidebar footer a{color:#ede7f4}.main{padding:32px 36px 60px;min-width:0;max-width:1600px;width:100%;margin:0 auto;align-self:start}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.6px;margin-bottom:8px}h1{font-size:29px;letter-spacing:-.7px;margin:0;font-weight:720}h2{font-size:20px;letter-spacing:-.3px;margin:0 0 10px}h3{font-size:15px;margin:0 0 10px}p{line-height:1.6} .muted{color:var(--muted)}.top-actions,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status-pill{background:white;border:1px solid var(--line);border-radius:40px;padding:8px 12px;font-size:12px;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;background:#a39caa;border-radius:50%;margin-right:7px}.dot.on{background:#48a879}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:18px 20px}.stat .number{font-size:31px;line-height:1.5;font-weight:650;letter-spacing:-1px}.stat .caption{font-size:12px;color:var(--muted)}.stat .hint{font-size:11px;color:var(--muted);margin-top:8px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:28px 0 18px}.section-head p{margin:0;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{width:220px}.list{display:flex;flex-direction:column;gap:13px}.job{display:grid;grid-template-columns:75px minmax(180px,1fr) minmax(260px,1.15fr) auto;gap:20px;background:white;border:1px solid var(--line);border-radius:12px;padding:18px;align-items:center}.job-cover{height:92px;width:74px;object-fit:cover;border-radius:5px;background:#e9e4ee;display:flex;align-items:center;justify-content:center;color:#978ba6;font-size:25px}.job h3{font-size:17px;line-height:1.4;margin:0 0 7px}.meta{font-size:12px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}.tag{display:inline-flex;border:1px solid var(--line);border-radius:5px;font-size:10px;padding:3px 6px;letter-spacing:.2px;color:var(--muted);margin-right:5px}.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.channel{font-size:11px;line-height:1.5}.channel strong{display:block;font-size:12px;margin-bottom:5px;font-weight:600}.badge{display:inline-block;font-size:10px;padding:4px 6px;border-radius:4px;background:#f0edf4;color:#776b86}.badge.good{background:#eaf6ef;color:var(--green)}.badge.warn{background:#fff4d9;color:#906007}.badge.bad{background:#ffebe8;color:var(--red)}.banner{padding:16px 20px;border-radius:10px;background:#eee9f4;border:1px solid #e1d8ec;line-height:1.6;margin:18px 0}.banner strong{display:block;font-size:14px;margin-bottom:3px}.banner small{color:#746287}.empty{padding:42px 24px;background:white;border:1px dashed #d3cbdc;border-radius:12px;color:var(--muted);text-align:center;line-height:1.8}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:16px}.calendar-day{display:grid;grid-template-columns:135px minmax(0,1fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}.calendar-day:last-child{border:0}.calendar-card{padding:14px 18px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;gap:15px;align-items:center}.calendar-date{font-size:13px;font-weight:600}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.metric-row{padding:13px 0;border-bottom:1px solid var(--line)}.metric-title{display:flex;justify-content:space-between;gap:15px;font-size:13px}.bar{height:5px;background:#f1edf5;border-radius:3px;margin:9px 0}.bar i{display:block;height:5px;background:var(--yellow);border-radius:3px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:12px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}.table-wrap th{white-space:nowrap}.table-wrap a{white-space:nowrap}.error-text{color:var(--red);font-size:12px;line-height:1.6}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:9px;padding:13px 20px;box-shadow:0 8px 40px #0002;max-width:min(700px,90vw);z-index:100;line-height:1.5}.toast[hidden]{display:none}dialog{width:min(1080px,calc(100vw - 32px));max-height:92vh;border:0;border-radius:14px;padding:0;box-shadow:0 24px 100px #0003;color:var(--ink)}dialog::backdrop{background:#17102099}.dialog-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:15px}.dialog-head h2{margin:0 0 6px}.dialog-body{padding:24px 26px}.detail-layout{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,1.2fr);gap:28px}.detail-cover{display:block;width:100%;max-height:440px;object-fit:contain;background:#f0edf4;border-radius:7px}.grid-preview{width:100%;margin:15px 0;border:1px solid var(--line)}.release-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.release-tabs button.active{background:var(--ink);color:white}.field{margin-bottom:15px}label{display:block;font-size:12px;font-weight:600;margin-bottom:7px}input,select,textarea{border:1px solid #dcd6e3;background:white;color:var(--ink);border-radius:7px;padding:10px 12px;width:100%;min-width:0}textarea{resize:vertical;line-height:1.55;font-size:13px;min-height:210px}.check{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:400}.check input{width:auto}hr{border:0;border-top:1px solid var(--line);margin:23px 0}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.locked{background:#f6f4f8;border-radius:8px;padding:13px;font-size:12px;line-height:1.65;margin-bottom:18px}.inline-link{font-size:12px;display:inline-block;margin-top:10px}.connection{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}.connection:last-child{border:0}.connection code{font-size:12px;overflow-wrap:anywhere}#busy{font-size:12px;color:var(--muted);min-height:20px;margin-top:10px}.no-wrap{white-space:nowrap}.form-title{font-size:17px;margin-bottom:20px}
@media(min-width:1600px){.main{padding-top:45px}}@media(max-width:1150px){.main{padding:26px 22px}.job{grid-template-columns:65px minmax(140px,1fr) auto;gap:15px}.job-cover{width:64px;height:80px}.channels{grid-column:2/4;grid-row:2}.job .open{grid-column:3;grid-row:1}}@media(max-width:800px){.shell{grid-template-columns:minmax(0,1fr)}.sidebar{min-width:0}.nav{min-width:0;max-width:100%}.sidebar{position:static;height:auto;padding:16px 18px}.brand strong{display:inline;font-size:17px;margin-right:9px}.brand span,.side-caption,.sidebar footer{display:none}.nav{flex-direction:row;overflow:auto;margin-top:12px}.nav button{white-space:nowrap;padding:8px}.nav button b{display:none}.main{padding:24px 16px}.top{align-items:start;flex-direction:column;gap:14px;margin-bottom:20px}h1{font-size:26px}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.stat .number{font-size:27px}.grid2,.detail-layout{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.detail-layout>aside{display:none}.dialog-head,.dialog-body{padding:18px}.calendar-day{grid-template-columns:1fr;gap:8px}.channels{gap:8px}.channel .badge{font-size:9px}.job{padding:14px;gap:12px;grid-template-columns:54px minmax(0,1fr) auto}.job-cover{width:54px;height:68px}.job h3{font-size:15px}.job .open{font-size:11px;padding:8px}.form-row{grid-template-columns:1fr}.calendar-card{align-items:start;flex-direction:column}.toolbar input{width:100%}.top-actions{max-width:100%}.table-wrap{max-width:100%}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><strong>АНАНАС</strong> МАРКЕТИНГ<br><span>Контент-завод агентства</span></div><div class="side-caption">Производство</div><nav class="nav" aria-label="Разделы"><button class="active" data-tab="queue"><b>▤</b>Очередь</button><button data-tab="calendar"><b>◷</b>Календарь</button><button data-tab="published"><b>↗</b>Публикации</button><button data-tab="analytics"><b>▥</b>Результаты</button><button data-tab="system"><b>⚙</b>Состояние</button></nav><footer>Instagram · Threads · Telegram<br><a href="https://t.me/lazyhim" target="_blank" rel="noopener">@lazyhim</a><br><span>Самара · UTC+4</span></footer></aside>
<main class="main"><header class="top"><div><div class="eyebrow" id="today"></div><h1 id="page-title">Очередь материалов</h1><div id="busy" aria-live="polite">Подключение к заводу…</div></div><div class="top-actions"><span class="status-pill" id="auto-status"></span><button class="primary" data-open="new">＋ Добавить материал</button></div></header><div id="stats" class="stats"></div><div id="content"></div></main></div>
<dialog id="detail" aria-label="Карточка материала"></dialog><dialog id="new" aria-label="Новый материал"></dialog><dialog id="measure" aria-label="Новый замер"></dialog><dialog id="lead" aria-label="Обращение"></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
const TOKEN=__TOKEN__;
let state=null,tab='queue',selected=null,platform='instagram',filter='all',age='latest',search='',signature='',toastTimer;
const $=id=>document.getElementById(id),names={instagram:'Instagram',threads:'Threads',telegram:'Telegram'},metricNames={views:'Просмотры',reach:'Охват',likes:'Нравится',comments:'Комментарии',replies:'Ответы',shares:'Отправки / пересылки',saves:'Сохранения',reposts:'Репосты',quotes:'Цитаты',profile_visits:'Переходы в профиль',follows:'Подписки'},endStates=['reported','published','verified','unknown','submitting'];
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);
const date=t=>t?new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Samara',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t)):'Время не указано';
const day=t=>new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Samara',day:'numeric',month:'long',weekday:'short'}).format(new Date(t));
function localDate(t){return t?new Date(new Date(t).getTime()+4*3600000).toISOString().slice(0,16):'';}
function iso(t){return t?t+':00+04:00':null;}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,7000);}
function badge(r){return `<span class="badge ${['verified','published'].includes(r.state)?'good':['reported','scheduled','prepared'].includes(r.state)?'warn':['unknown','error'].includes(r.state)?'bad':''}">${E(r.label)}</span>`;}
function release(id){return state.releases.find(r=>r.id===Number(id));}
function options(values,current){return values.map(([v,n])=>`<option value="${E(v)}" ${v===current?'selected':''}>${E(n)}</option>`).join('');}
function terminal(r){return endStates.includes(r.state);}
async function act(action,data={}){const r=await fetch('/api/factory-action',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':TOKEN},body:JSON.stringify({action,...data})});const body=await r.json();if(!r.ok)throw Error(body.error||'Действие не выполнено');await refresh(true);return body;}
async function browser(action,p){const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':TOKEN},body:JSON.stringify({action,platform:p})});const b=await r.json();if(!r.ok)throw Error(b.error);await refresh(true);}
async function refresh(force=false){try{const response=await fetch('/api/factory');if(!response.ok)throw Error('Нет связи с заводом');const next=await response.json();state=next;$('busy').textContent=next.browser.busy?'Выполняется: '+next.browser.message:next.browser.message;$('auto-status').innerHTML=`<span class="dot ${next.settings.autopublish?'on':''}"></span>${next.settings.autopublish?'Выпуск по времени включён':'Выпуск по времени на паузе'}`;
const comparable=JSON.stringify({...next,now:null,settings:{...next.settings,heartbeat:null}});if(force||comparable!==signature){if(force||!document.activeElement.matches('input,textarea,select')){render();signature=comparable;if($('detail').open)renderDetail();}}}catch(e){$('busy').textContent=e.message;}}
function render(){const c=state.counts;$('today').textContent=day(new Date());$('page-title').textContent={queue:'Очередь материалов',calendar:'Календарь выпуска',published:'Опубликованные материалы',analytics:'Результаты контента',system:'Состояние завода'}[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('stats').innerHTML=[[c.materials,'Материалов','В очереди и архиве'],[c.scheduled,'Запланировано','Отдельно по площадкам'],[c.published,'Размещений','Включая сообщения владельца'],[c.attention,'Требуют внимания','Ошибки и пропущенное время']].map(([n,t,h])=>`<div class="stat"><div class="caption">${t}</div><div class="number">${n}</div><div class="hint">${h}</div></div>`).join('');if(tab==='queue')renderQueue();if(tab==='calendar')renderCalendar();if(tab==='published')renderPublished();if(tab==='analytics')renderAnalytics();if(tab==='system')renderSystem();}
function renderQueue(){const jobs=state.materials.filter(m=>normal(m.title+' '+m.niche).includes(normal(search)));$('content').innerHTML=`<div class="section-head"><div><h2>От источника до публикации</h2><p>Один материал — отдельный выпуск для каждой площадки.</p></div><div class="toolbar"><input id="search" aria-label="Поиск материалов" placeholder="Найти материал…" value="${E(search)}"><button data-open="import">Импорт комплекта</button></div></div><div class="list">${jobs.map(m=>{const rows=state.releases.filter(r=>r.material_id===m.id),withPack=rows.find(r=>r.version_id);return `<article class="job">${withPack?`<img class="job-cover" src="/factory-file/${withPack.id}/slide-01.png" alt="Обложка ${E(m.title)}">`:'<div class="job-cover" aria-hidden="true">▤</div>'}<div><h3>${E(m.title)}</h3><div class="meta"><span class="tag">${E(m.niche||'Ниша не выбрана')}</span><span class="tag">${withPack?'Комплект готов':'Нужна подготовка'}</span></div><div class="meta">${withPack?withPack.assets.length+' карточек':'Добавь источник и подготовь комплект'}</div></div><div class="channels">${rows.map(r=>`<div class="channel"><strong>${names[r.platform]}</strong>${badge(r)}${r.scheduled_at?`<div class="meta">${date(r.scheduled_at)}</div>`:''}</div>`).join('')}</div><button class="open small" data-detail="${E(m.id)}">Открыть →</button></article>`;}).join('')||'<div class="empty">Здесь появятся материалы.<br>Добавь источник или импортируй готовый комплект карточек.</div>'}</div>`;}
function renderCalendar(){const rows=state.releases.filter(r=>r.scheduled_at&&!endStates.includes(r.state)).sort((a,b)=>a.scheduled_at.localeCompare(b.scheduled_at));const groups={};for(const r of rows){const d=day(r.scheduled_at);(groups[d]??=[]).push(r);}$('content').innerHTML=`<div class="section-head"><div><h2>Расписание по площадкам</h2><p>Время Самары. После пропущенного окна перенеси выпуск на новую дату.</p></div></div>${rows.length?`<div class="panel">${Object.entries(groups).map(([d,items])=>`<section class="calendar-day"><div class="calendar-date">${d}</div><div>${items.map(r=>`<div class="calendar-card"><div><strong>${E(r.title)}</strong><div class="meta">${names[r.platform]} · ${date(r.scheduled_at)} · ${r.auto?'По времени':'Ручной выпуск'} ${r.overdue?'· Время пропущено':''}</div></div><div class="actions">${badge(r)}<button class="small" data-detail="${E(r.material_id)}" data-platform="${r.platform}">Открыть</button></div></div>`).join('')}</div></section>`).join('')}</div>`:'<div class="empty">Расписание пока пустое.<br>Открой материал, одобри версию и выбери дату выпуска.</div>'}`;}
function renderPublished(){const rows=state.releases.filter(r=>['reported','published','verified','unknown'].includes(r.state));$('content').innerHTML=`<div class="section-head"><div><h2>Реестр размещений</h2><p>Ссылка связывает публикацию с её замерами и обращениями.</p></div></div><div class="panel table-wrap"><table><thead><tr><th>Материал</th><th>Площадка</th><th>Подтверждение</th><th>Время выхода</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${E(r.title)}</strong><div class="meta">@${E(r.account)}</div></td><td>${names[r.platform]}</td><td>${badge(r)}<div class="meta">${E(r.evidence==='browser_verified'?'Сверены аккаунт и текст':r.evidence==='platform_confirmation'?'Подтверждено соцсетью':r.evidence)}</div></td><td>${date(r.published_at)}</td><td>${r.permalink?`<a href="${E(r.permalink)}" target="_blank" rel="noopener">Открыть пост ↗</a><br>`:''}<button class="small" data-detail="${E(r.material_id)}" data-platform="${r.platform}">${r.permalink?'Карточка':'Добавить ссылку'}</button></td></tr>`).join('')||'<tr><td colspan="5">Публикации появятся после размещения.</td></tr>'}</tbody></table></div>`;}
function point(r,metric){if(age==='latest')return r.metrics.find(m=>m.metric===metric);const target=Number(age),rows=state.measurements.filter(m=>m.release_id===r.id&&m.metric===metric&&r.published_at).map(m=>({...m,age_days:(new Date(m.measured_at)-new Date(r.published_at))/86400000})).filter(m=>Math.abs(m.age_days-target)<=Math.max(.25,target*.15));return rows.sort((a,b)=>Math.abs(a.age_days-target)-Math.abs(b.age_days-target))[0];}
function renderAnalytics(){const c=state.counts;const rows=state.releases.filter(r=>['reported','published','verified'].includes(r.state)&&(filter==='all'||r.platform===filter));$('content').innerHTML=`<div class="section-head"><div><h2>Что происходит после выхода</h2><p>Пропуск данных — не ноль. Возраст замера указан у каждого поста.</p></div><div class="toolbar"><select id="platform-filter" aria-label="Площадка">${options([['all','Все площадки'],...Object.entries(names)],filter)}</select><select id="age-filter" aria-label="Возраст поста">${options([['latest','Последний замер'],['1','Через 24 часа'],['7','Через 7 дней'],['30','Через 30 дней']],age)}</select><button data-export>CSV</button></div></div><div class="grid2"><section class="panel"><h3>Просмотры публикаций</h3>${rows.length?rows.map(r=>{const p=point(r,'views');const max=Math.max(1,...rows.filter(x=>x.platform===r.platform).map(x=>point(x,'views')?.value||0));return `<div class="metric-row"><div class="metric-title"><span>${E(r.title)} <span class="muted">· ${names[r.platform]}</span></span><strong>${p?.status==='ok'?num(p.value):'—'}</strong></div><div class="bar"><i style="width:${p?.status==='ok'?Math.max(1,p.value/max*100):0}%"></i></div><div class="meta">${p?E(p.source)+' · '+date(p.measured_at)+(p.age_days!=null?' · возраст '+num(p.age_days)+' дн.':' · дата выхода не указана'):'Замера для выбранного возраста нет'}</div><button class="small" data-measure="${r.id}">Добавить замер</button></div>`;}).join(''):'<p class="muted">Сначала размести материал.</p>'}</section><section class="panel"><h3>Обращения в агентство</h3><div class="stats" style="grid-template-columns:1fr 1fr;margin:18px 0"><div><div class="number" style="font-size:28px">${c.leads}</div><div class="meta">Обращений</div></div><div><div style="font-size:28px">${c.qualified}</div><div class="meta">Квалифицированных, включая сделки</div></div><div><div style="font-size:28px">${c.won}</div><div class="meta">Сделок</div></div><div><div style="font-size:28px">${num(c.revenue)} ₽</div><div class="meta">Подтверждённой выручки</div></div></div><p class="meta">Это учтённые обращения по всем материалам. Источник связывается с конкретным постом, когда он известен.</p><button data-open="lead">＋ Учесть обращение</button><hr><h3>Обзор результатов</h3><p class="meta">${state.measurements.length?'В базе '+state.measurements.length+' замеров. Сравнивай публикации одной площадки на одинаковом возрасте. По одному посту нельзя определить лучшую подачу.':'Данных для сравнения ещё нет. Первый замер стоит сделать через сутки после выхода.'}</p><p class="meta">Просмотры разных площадок не складываются в уникальную аудиторию.</p></section></div><section class="panel table-wrap"><h3>Все показатели</h3><table><thead><tr><th>Материал</th><th>Площадка</th><th>Метрика</th><th>Значение</th><th>Возраст</th><th>Источник / время</th></tr></thead><tbody>${rows.flatMap(r=>Object.keys(metricNames).map(k=>[k,point(r,k)]).filter(([,p])=>p).map(([k,p])=>`<tr><td>${E(r.title)}</td><td>${names[r.platform]}</td><td>${metricNames[k]}</td><td>${p.status==='ok'?num(p.value):E({no_access:'Нет доступа',unsupported:'Недоступно',error:'Ошибка сбора',not_measured:'Нет замера'}[p.status])}</td><td>${p.age_days==null?'—':num(p.age_days)+' дн.'}</td><td>${E(p.source)}<div class="meta">${date(p.measured_at)}</div></td></tr>`)).join('')||'<tr><td colspan="6">Замеров пока нет. Можно начать с ручного ввода.</td></tr>'}</tbody></table></section>${state.leads.length?`<section class="panel table-wrap"><h3>Учтённые обращения</h3><table><thead><tr><th>Запись продаж</th><th>Источник</th><th>Этап</th><th>Выручка</th></tr></thead><tbody>${state.leads.map(l=>`<tr><td>${E(l.reference)}</td><td>${l.release_id?E(release(l.release_id)?.title)+' · '+names[release(l.release_id)?.platform]:'Источник неизвестен'}</td><td>${{new:'Обращение',qualified:'Квалифицировано',won:'Сделка',lost:'Не состоялось'}[l.stage]}</td><td>${l.amount==null?'—':num(l.amount)+' ₽'}</td></tr>`).join('')}</tbody></table></section>`:''}`;}
function renderSystem(){$('content').innerHTML=`<div class="grid2"><section class="panel"><h2>Выпуск по времени</h2><p class="muted">В очередь отправки попадают только одобренные версии с назначенным временем и включённым выпуском по расписанию.</p><button class="${state.settings.autopublish?'':'primary'}" data-auto="${!state.settings.autopublish}">${state.settings.autopublish?'Поставить выпуск на паузу':'Включить выпуск по времени'}</button><div class="connection"><span>Последняя проверка очереди</span><span class="meta">${date(state.settings.heartbeat)}</span></div><div class="connection"><span>Часовой пояс</span><span>Самара · UTC+4</span></div><p class="meta">Для браузерного выпуска оставь ПК включённым, с доступным рабочим столом и работающим VPN. Пропущенное время более чем на 10 минут требует переноса.</p></section><section class="panel"><h2>Подключения</h2><div class="connection"><div><strong>Instagram</strong><div class="meta">@volodtarasov · браузер</div></div><button class="small" data-login="instagram">Открыть / войти</button></div><div class="connection"><div><strong>Threads</strong><div class="meta">@volodtarasov · браузер</div></div><button class="small" data-login="threads">Открыть / войти</button></div><div class="connection"><div><strong>Telegram</strong><div class="meta">@lazyhim · ручной выпуск</div></div><a href="https://t.me/lazyhim" target="_blank" rel="noopener">Канал ↗</a></div><div class="connection"><span>Маршрут браузера</span><code>${E(state.browser.proxy||'Системное подключение')}</code></div></section></div><section class="panel"><h2>Контур подготовки</h2><p>Добавь источник → открой бриф → подготовь комплект через навык → импортируй его в материал → просмотри и одобри версии площадок.</p><p class="meta">Тексты и карточки готовятся через существующий навык agency-carousel. Фоновая генерация ИИ и автоматический выпуск Telegram пока не подключены. Замеры можно вводить вручную; кнопка сбора через браузер сохраняет только уверенно распознанные показатели.</p><a href="/publisher" target="_blank" rel="noopener">Открыть прежнюю панель публикатора ↗</a></section>`;}
function normal(v){return String(v||'').toLowerCase().trim();}
function openDetails(mid,p){selected=mid;platform=p||'instagram';renderDetail();if(!$('detail').open)$('detail').showModal();}
function renderDetail(){const m=state.materials.find(m=>m.id===selected);if(!m)return;const rows=state.releases.filter(r=>r.material_id===selected),r=rows.find(r=>r.platform===platform)||rows[0],hasPack=!!r.version_id,locked=terminal(r);$('detail').innerHTML=`<div class="dialog-head"><div><h2>${E(m.title)}</h2><div class="meta">${E(m.niche||'Ниша не указана')} · ${hasPack?r.assets.length+' карточек':'Подготовка комплекта'}</div></div><button class="small" data-close="detail" aria-label="Закрыть карточку">✕</button></div><div class="dialog-body"><div class="detail-layout"><aside>${hasPack?`<img class="detail-cover" src="/factory-file/${r.id}/slide-01.png" alt="Обложка"><a class="inline-link" href="/factory-file/${r.id}/preview.html" target="_blank" rel="noopener">Открыть весь комплект ↗</a><img class="grid-preview" src="/factory-file/${r.id}/profile-grid-preview.png" alt="Проверочное превью сетки Instagram">`:'<div class="empty">Здесь будет обложка комплекта</div>'}<div class="meta">Источник: ${E(m.source||'не указан')}</div><a class="inline-link" href="/factory-brief/${E(m.id)}" target="_blank" rel="noopener">Открыть бриф для подготовки ↗</a><div class="actions" style="margin-top:15px"><button class="small" data-brief="${E(m.id)}">Скопировать бриф</button><button class="small" data-import-material="${E(m.id)}">${hasPack?'Обновить комплект':'Импорт комплекта'}</button></div></aside><div><div class="release-tabs">${rows.map(x=>`<button class="small ${x.platform===r.platform?'active':''}" data-release-tab="${x.platform}">${names[x.platform]}</button>`).join('')}</div><div class="actions" style="margin-bottom:15px">${badge(r)}${r.permalink?`<a href="${E(r.permalink)}" target="_blank" rel="noopener">Открыть пост ↗</a>`:''}</div>${r.error?`<p class="error-text">${E(r.error)}</p>`:''}<div class="field"><label for="release-account">Аккаунт / канал</label><div class="actions"><input id="release-account" value="${E(r.account)}" placeholder="@username" ${locked?'disabled':''} style="flex:1;width:auto"><button class="small" data-rid="${r.id}" data-do="account" ${locked?'disabled':''}>Сохранить</button></div></div><div class="field"><label for="release-caption">${names[r.platform]} — текст</label><textarea id="release-caption" ${locked?'readonly':''}>${E(r.caption)}</textarea><div class="actions" style="margin-top:8px"><span class="meta">${r.caption.length} символов · версия ${r.version_id||'—'}</span><button class="small" data-copy="release-caption">Копировать текст</button>${!locked&&hasPack?`<button class="small" data-rid="${r.id}" data-do="caption">Сохранить текст</button>`:''}</div></div>${locked?`<div class="locked">Этот выпуск защищён от повторной отправки. Укажи прямую ссылку и проверь выход, если размещал пост вручную.</div>`:`${hasPack?`<div class="actions"><button class="primary" data-rid="${r.id}" data-do="approve">${r.approval===r.digest?'Одобрено · обновить':'Одобрить эту версию'}</button>${r.platform!=='telegram'?`<button data-rid="${r.id}" data-do="factory_prepare">Подготовить в браузере</button><button class="dark" data-rid="${r.id}" data-do="factory_publish" ${r.state!=='prepared'||r.approval!==r.digest?'disabled':''}>Опубликовать</button>`:`<a href="https://t.me/${E(r.account||'lazyhim')}" target="_blank" rel="noopener">Открыть канал ↗</a>`}</div><hr><h3>Дата выпуска</h3><div class="field"><label for="release-schedule">По Самаре · UTC+4</label><input type="datetime-local" id="release-schedule" value="${localDate(r.scheduled_at)}"></div><div class="field"><label class="check"><input type="checkbox" id="release-auto" ${r.auto?'checked':''} ${r.platform==='telegram'?'disabled':''}>Отправить автоматически в назначенное время</label></div><div class="actions"><button data-rid="${r.id}" data-do="schedule">Запланировать</button><button data-rid="${r.id}" data-do="pause">Пауза</button></div>`:'<p class="muted">Подготовь комплект по брифу и импортируй его в этот материал.</p>'}`}<hr><h3>${locked?'Ссылка и подтверждение':'Уже разместил вручную?'}</h3><div class="field"><label for="release-link">Прямая ссылка на пост</label><input type="url" id="release-link" value="${E(r.permalink)}" placeholder="https://…"></div><div class="field"><label for="release-published">Фактическое время выхода по Самаре, если известно</label><input type="datetime-local" id="release-published" value="${localDate(r.published_at)}"></div><div class="actions"><button data-rid="${r.id}" data-do="report">Сохранить размещение</button>${['reported','published','verified','unknown'].includes(r.state)?`<button data-rid="${r.id}" data-do="factory_verify">Проверить ссылку</button>${r.platform!=='telegram'?`<button class="small" data-rid="${r.id}" data-do="factory_discover">Найти в профиле</button>`:''}`:''}</div>${['reported','published','verified'].includes(r.state)?`<hr><h3>Результаты поста</h3><div class="actions"><button data-measure="${r.id}">Добавить замер</button>${r.platform!=='telegram'?`<button data-rid="${r.id}" data-do="factory_collect">Собрать через браузер</button>`:''}</div><p class="meta">${r.platform==='telegram'?'Пока доступен ручной ввод статистики канала.':'Если соцсеть не покажет статистику, замер можно ввести вручную.'}</p>`:''}</div></div></div>`;}
function openNew(importOnly=false,mid=''){const d=$('new');d.innerHTML=`<div class="dialog-head"><h2>${importOnly?'Импорт готового комплекта':'Добавить материал'}</h2><button class="small" data-close="new">✕</button></div><form class="dialog-body" id="new-form"><input type="hidden" name="material_id" value="${E(mid)}">${!mid?`<div class="field"><label>Название</label><input name="title" required placeholder="Например: Авито для химчистки"></div><div class="field"><label>Ниша</label><input name="niche" placeholder="Авто / химчистки одежды"></div>`:''}${importOnly?`<div class="field"><label>Папка готового комплекта</label><select name="pack" required>${options(state.packs.map(p=>[p,p]),'')}</select><p class="meta">Каталог .tools/carousel-out. Файлы должны пройти экспорт и проверку.</p></div>`:`<div class="field"><label>Markdown-источник кейса</label><input name="source" placeholder="D:\SecondBrain\HyperCRM\agency\cases\…"></div><p class="meta">Новый материал попадёт в очередь подготовки. Бриф доступен в его карточке.</p>`}<input name="action" type="hidden" value="${importOnly?'import':'source'}"><button class="primary" type="submit">${importOnly?'Импортировать':'Добавить в очередь'}</button></form>`;d.showModal();}
function openMeasure(rid){const r=release(rid),d=$('measure');d.innerHTML=`<div class="dialog-head"><div><h2>Добавить замер</h2><div class="meta">${E(r.title)} · ${names[r.platform]}</div></div><button class="small" data-close="measure">✕</button></div><form class="dialog-body" id="measure-form"><input type="hidden" name="release_id" value="${rid}"><div class="form-row"><div class="field"><label>Показатель</label><select name="metric">${options(Object.entries(metricNames),'views')}</select></div><div class="field"><label>Состояние данных</label><select name="status" id="measurement-status">${options([['ok','Есть значение'],['no_access','Нет доступа'],['unsupported','Не поддерживается'],['error','Ошибка сбора'],['not_measured','Ещё не измерено']],'ok')}</select></div></div><div class="field"><label>Значение, включая 0</label><input type="number" min="0" step="1" name="value" id="measurement-value" required></div><div class="field"><label>Когда измерено, по Самаре</label><input type="datetime-local" name="measured_at" value="${localDate(new Date())}" required></div><div class="field"><label>Источник</label><input name="source" value="Ручной ввод · статистика поста" required></div><button class="primary" type="submit">Сохранить замер</button></form>`;d.showModal();}
function openLead(){const d=$('lead');d.innerHTML=`<div class="dialog-head"><h2>Учесть обращение</h2><button class="small" data-close="lead">✕</button></div><form class="dialog-body" id="lead-form"><div class="field"><label>Ссылка или постоянный ID записи продаж</label><input name="reference" required placeholder="Ссылка на карточку CRM или ID"><p class="meta">Повторный ввод того же ID обновит этап, не увеличивая число обращений.</p></div><div class="field"><label>Пост-источник, если известен</label><select name="release_id">${options([['','Источник неизвестен'],...state.releases.filter(r=>['reported','published','verified'].includes(r.state)).map(r=>[String(r.id),r.title+' · '+names[r.platform]])],'')}</select></div><div class="field"><label>Этап</label><select name="stage">${options([['new','Обращение'],['qualified','Квалифицировано'],['won','Сделка'],['lost','Не состоялось']],'new')}</select></div><div class="field"><label>Подтверждённая выручка сделки, ₽ — если известна</label><input name="amount" type="number" min="0" step="0.01"></div><div class="field"><label>Примечание</label><input name="note"></div><button class="primary" type="submit">Сохранить</button></form>`;d.showModal();}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a[data-action]');if(!b)return;try{if(b.dataset.tab){tab=b.dataset.tab;render();return;}if(b.dataset.close){$(b.dataset.close).close();return;}if(b.dataset.detail){openDetails(b.dataset.detail,b.dataset.platform);return;}if(b.dataset.releaseTab){platform=b.dataset.releaseTab;renderDetail();return;}if(b.dataset.open){if(b.dataset.open==='lead')openLead();else openNew(b.dataset.open==='import');return;}if(b.dataset.importMaterial){openNew(true,b.dataset.importMaterial);return;}if(b.dataset.measure){openMeasure(Number(b.dataset.measure));return;}if(b.dataset.copy){await navigator.clipboard.writeText($(b.dataset.copy).value);toast('Текст скопирован');return;}if(b.dataset.brief){const r=await fetch('/factory-brief/'+b.dataset.brief);if(!r.ok)throw Error('Бриф недоступен');await navigator.clipboard.writeText(await r.text());toast('Бриф скопирован — передай его помощнику для подготовки');return;}if(b.hasAttribute('data-export')){const rows=[['Материал','Площадка','Метрика','Значение','Состояние','Измерено','Источник'],...state.releases.flatMap(r=>r.metrics.map(m=>[r.title,names[r.platform],metricNames[m.metric],m.value??'',m.status,m.measured_at,m.source]))];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='content-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}b.disabled=true;if(b.dataset.auto){await act('autopublish',{enabled:b.dataset.auto==='true'});toast('Режим выпуска обновлён');return;}if(b.dataset.login){await browser('login',b.dataset.login);return;}if(b.dataset.do){const rid=Number(b.dataset.rid),action=b.dataset.do;let data={release_id:rid};if(action==='account')data.account=$('release-account').value;if(action==='caption')data.caption=$('release-caption').value;if(action==='schedule'){data.scheduled_at=iso($('release-schedule').value);data.auto=$('release-auto').checked;}if(action==='report'){data.permalink=$('release-link').value;data.published_at=iso($('release-published').value);}if(action==='factory_verify'&&$('release-link').value!==release(rid).permalink)throw Error('Сначала сохрани новую ссылку размещения');await act(action,data);toast(action.startsWith('factory_')?'Действие запущено. Результат появится в карточке.':'Сохранено');}}catch(error){toast(error.message);}finally{if(b.isConnected)b.disabled=false;}});
document.addEventListener('submit',async e=>{if(!['new-form','measure-form','lead-form'].includes(e.target.id))return;e.preventDefault();const form=e.target,b=form.querySelector('button[type=submit]');b.disabled=true;try{const data=Object.fromEntries(new FormData(form));let action=data.action;if(form.id==='measure-form'){action='measurement';data.measured_at=iso(data.measured_at);data.release_id=Number(data.release_id);if(data.status!=='ok')data.value=null;}if(form.id==='lead-form'){action='lead';data.release_id=data.release_id?Number(data.release_id):null;}delete data.action;await act(action,data);form.closest('dialog').close();toast('Сохранено');}catch(error){toast(error.message);}finally{b.disabled=false;}});
document.addEventListener('change',e=>{if(e.target.id==='platform-filter'){filter=e.target.value;renderAnalytics();}if(e.target.id==='age-filter'){age=e.target.value;renderAnalytics();}if(e.target.id==='measurement-status'){$('measurement-value').required=e.target.value==='ok';$('measurement-value').disabled=e.target.value!=='ok';}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const position=e.target.selectionStart;renderQueue();$('search').focus();$('search').setSelectionRange(position,position);}});
refresh();setInterval(()=>refresh(),4000);
</script></body></html>

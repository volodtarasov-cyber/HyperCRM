<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Стиралкин — боты в Telegram и MAX</title>
  <style>
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #e9edef; }
    body { font-family: Arial, Helvetica, sans-serif; color: #172a35; }
    .page {
      position: relative;
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }
    .eyebrow {
      position: absolute;
      top: 17mm;
      left: 16mm;
      font-size: 11pt;
      font-weight: 700;
      letter-spacing: .15em;
      line-height: 1;
    }
    .headline {
      position: absolute;
      top: 38mm;
      left: 16mm;
      width: 178mm;
      margin: 0;
      font-size: 32.5pt;
      font-weight: 700;
      letter-spacing: -.028em;
      line-height: 1.12;
      white-space: nowrap;
    }
    .instruction {
      position: absolute;
      top: 91mm;
      left: 16mm;
      margin: 0;
      font-size: 13.5pt;
      line-height: 1.3;
    }
    .codes {
      position: absolute;
      top: 121mm;
      left: 16mm;
      width: 178mm;
      display: grid;
      grid-template-columns: 85mm 85mm;
      column-gap: 8mm;
    }
    .code { text-align: center; }
    .code img {
      display: block;
      width: 85mm;
      height: 85mm;
    }
    .code-label {
      margin-top: 3mm;
      font-size: 15pt;
      font-weight: 700;
      letter-spacing: .09em;
      line-height: 1;
    }
    .cta {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 26mm;
      margin: 0;
      text-align: center;
      font-size: 28pt;
      font-weight: 700;
      letter-spacing: -.025em;
      line-height: 1;
      white-space: nowrap;
    }
    @media screen {
      .page { box-shadow: 0 8px 30px rgba(0, 0, 0, .12); }
    }
    @media print {
      html, body { background: #fff; }
      .page { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">БОТЫ / СТИРАЛКИН</div>
    <h1 class="headline">ВСЕ ВАЖНЫЕ<br>УВЕДОМЛЕНИЯ — ЗДЕСЬ.</h1>
    <p class="instruction">Выберите удобный мессенджер и подпишитесь.</p>
    <div class="codes">
      <div class="code">
        <img src="telegram-qr.svg" alt="QR-код бота Стиралкина в Telegram">
        <div class="code-label">TELEGRAM</div>
      </div>
      <div class="code">
        <img src="max-qr.svg" alt="QR-код бота Стиралкина в MAX">
        <div class="code-label">MAX</div>
      </div>
    </div>
    <p class="cta">ПОДПИСЫВАЙТЕСЬ!</p>
  </main>
</body>
</html>

# Замечания к черновикам — встают в начало каждого Word-файла.
# Читает клиент: коротко, по делу, с вопросом, на который он может ответить.

bu-avto-iz-kitaya-pod-zakaz:
  - "**Нужны реальные цифры.** В статье нет ни одной цены. Дайте 2–3 примера ваших сделок: модель, год, пробег, итог «под ключ» в рублях — вставим вместо общих слов «заметно дешевле»."
  - "**Как вы проверяете машину в Китае?** Кто осматривает на месте, что входит в проверку, даёте ли отчёт с фото до оплаты. Сейчас раздел описывает проверку вообще, а не вашу."
  - "**Неточность:** «налоги считаются не от цены авто, а от объёма двигателя». Для машин младше 3 лет пошлина считается от цены. Поправим — подтвердите, что ваш брокер считает так же."
  - "**Проверка по VIN.** В статье «запросить VIN-историю по открытым базам». Российские базы (ГИБДД) не знают истории китайских машин. Откуда вы берёте историю авто из Китая?"
  - "**Сроки:** «несколько недель». Назовите реальный срок от заявки до выдачи для б/у из Китая."

skolko-stoit-prignat-mashinu-iz-korei:
  - "**Главное: статья про стоимость без единой суммы.** Таблица «пример расчёта» состоит из слов «выше/ниже». Нужны 2 реальных расчёта по вашим сделкам: модель, год, объём и мощность, цена в Корее, доставка, пошлина, утильсбор, ваша комиссия, итог."
  - "**Неточность про утильсбор.** Сейчас написано, что ставка зависит от объёма двигателя. С 2025 года для льготной ставки главное — мощность до 160 л.с. (так считает и калькулятор на сайте). Поправим."
  - "**Ваша комиссия.** В статье «фиксированная сумма или процент». Как берёте вы? Можно назвать цифру или «от … ₽»?"
  - "**Доставка.** Ро-ро или контейнер, через Владивосток — так вы и возите? Сколько дней от покупки в Корее до Самары?"
  - "**Два почти одинаковых вопроса в конце** («Сколько стоит пригнать машину из Кореи?» и «…в Россию?») — один уберём."

avto-iz-kitaya-pod-zakaz-novye:
  - "**Эта статья уже висит на сайте** с 29 сентября — её не согласовывали. Если что-то неверно, поправим сразу."
  - "**9 заглушек «уточнить у поставщика»** в таблицах цен (6 брендов) и сроков доставки (3 способа). Нужны ваши цифры: цена «под ключ» от … ₽ по моделям и срок по каждому способу — или уберём колонки."
  - "**Текст написан со стороны:** «мы не проверяли надёжность конкретных посредников», «уточнить у поставщика». Но посредник здесь — вы. Перепишем от лица ARCars: как работаете вы."
  - "**Срок:** в статье «от месяца до двух с половиной», на сайте — «от 3 недель». Какой верный для новых машин из Китая?"
  - "**Гарантия.** Даёте ли вы свою гарантию или сопровождение после выдачи? Если да — допишем, это сильный аргумент."

kak-proverit-avto-po-statistike-auktsionov-yaponii:
  - "**Так ли работаете вы?** В конце статьи: «агент смотрит машину вживую на площадке перед торгами». Подтвердите — или опишем, как проверяете лот вы."
  - "**Устаревшее:** в таблице расходов «Оформление ПТС». Сейчас выдают электронный паспорт (ЭПТС). Поправим."
  - "**Пример с Toyota Harrier** (650–780 тыс. иен) помечен как условный. Если дадите реальную выборку из вашей статистики — заменим, будет убедительнее."
  - "**Оценка 5–6 баллов** связана в тексте с пробегом до 10–15 тыс. км. Согласны с этой привязкой?"
  - "**Какой статистикой пользуетесь вы** (сайт, сервис)? Можно назвать в статье или дать ссылку."

kakoe-avto-vygodno-privezti-iz-korei:
  - "**Проверьте дату:** статья начинается с «С июня 2026 года утильсбор вырос». Так ли это и с какого числа? Если дата неверна — вся статья будет выглядеть недостоверной."
  - "**Похоже на ошибку:** в таблице утильсбор для машин до 3 лет назван выше, чем для 3–5 лет. Для ввоза физлицом для себя, насколько мы знаем, наоборот. Подтвердите у брокера."
  - "**Мощность моделей.** Kia K5 с базовым мотором — укладывается в 160 л.с.? Сверьте по моделям из списка, которые вы реально возите."
  - "**Renault Samsung** теперь называется Renault Korea. Возите ли вы эти машины? Если нет — раздел можно убрать."
  - "**Ваш опыт:** какие из этих моделей у вас заказывают чаще всего и есть ли пример расчёта под ключ? Один реальный пример сильнее всей таблицы."
